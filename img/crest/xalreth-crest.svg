<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <title>The crest of the Cult of Xal'Reth</title>
  <!-- Flat redraw of the guild tabard: a dark banner on a gold rod, a magenta beaded trim down each side,
       and the Coil: a magenta serpent ringed round, its two heads meeting at the top with their fangs bared. -->
  <defs>
    <pattern id="beads" width="16" height="13" patternUnits="userSpaceOnUse">
      <rect width="16" height="13" fill="#7a1a7c"/>
      <ellipse cx="8" cy="6.5" rx="6.2" ry="5" fill="#d43bd6"/>
      <ellipse cx="8" cy="6.5" rx="2.4" ry="1.8" fill="#5a105c"/>
    </pattern>
    <clipPath id="banner"><path d="M22 18 H178 V176 L100 230 L22 176 Z"/></clipPath>
  </defs>
  <!-- the banner -->
  <path d="M22 18 H178 V176 L100 230 L22 176 Z" fill="#1b1820"/>
  <g clip-path="url(#banner)">
    <path d="M22 18 H178 V60 Q100 44 22 60 Z" fill="#24202b"/>
    <!-- the beaded trim -->
    <rect x="22" y="18" width="16" height="230" fill="url(#beads)"/>
    <rect x="162" y="18" width="16" height="230" fill="url(#beads)"/>
    <path d="M22 176 L100 230 L178 176 L178 192 L100 246 L22 192 Z" fill="url(#beads)"/>
  </g>
  <path d="M22 18 H178 V176 L100 230 L22 176 Z" fill="none" stroke="#0b0a0e" stroke-width="3" stroke-linejoin="round"/>
  <!-- the gold rod and its finials -->
  <rect x="10" y="10" width="180" height="11" rx="5.5" fill="#e3b54a" stroke="#6b4a10" stroke-width="2"/>
  <rect x="14" y="12" width="172" height="3" rx="1.5" fill="#fbe7a0"/>
  <circle cx="10" cy="15.5" r="8" fill="#e3b54a" stroke="#6b4a10" stroke-width="2"/>
  <circle cx="190" cy="15.5" r="8" fill="#e3b54a" stroke="#6b4a10" stroke-width="2"/>
  <!-- the Coil: the serpent's body ringed round, scaled along its length -->
  <g fill="none" stroke-linecap="round">
    <path d="M124 92 A46 46 0 1 1 76 92" stroke="#5a105c" stroke-width="20"/>
    <path d="M124 92 A46 46 0 1 1 76 92" stroke="#d43bd6" stroke-width="15"/>
    <path d="M124 92 A46 46 0 1 1 76 92" stroke="#7a1a7c" stroke-width="3.5" stroke-dasharray="3 5"/>
  </g>
  <!-- the two heads, curling in to face each other, and their fangs -->
  <g fill="#d43bd6" stroke="#5a105c" stroke-width="2.5" stroke-linejoin="round">
    <path d="M64 96 C62 82 72 72 86 74 C95 75 100 80 99 87 C98 94 91 97 84 96 L79 101 C74 102 66 102 64 96 Z"/>
    <path d="M136 96 C138 82 128 72 114 74 C105 75 100 80 101 87 C102 94 109 97 116 96 L121 101 C126 102 134 102 136 96 Z"/>
  </g>
  <g fill="#f3d6f4" stroke="#5a105c" stroke-width="1.6" stroke-linejoin="round">
    <path d="M86 95 L89 124 L93 95 Z"/>
    <path d="M114 95 L111 124 L107 95 Z"/>
  </g>
  <g fill="#1b1820"><circle cx="84" cy="83" r="3.2"/><circle cx="116" cy="83" r="3.2"/></g>
  <g fill="#fbe7a0"><circle cx="85" cy="82" r="1"/><circle cx="117" cy="82" r="1"/></g>
</svg>
