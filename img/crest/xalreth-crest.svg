<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <title>The crest of the Cult of Xal'Reth</title>
  <!-- The guild tabard: a dark banner on a gold rod, a magenta beaded trim down each side, and the Coil, the guild's own emblem. -->
  <defs>
    <pattern id="beads" width="16" height="13" patternUnits="userSpaceOnUse">
      <rect width="16" height="13" fill="#7a1a7c"/>
      <ellipse cx="8" cy="6.5" rx="6.2" ry="5" fill="#d43bd6"/>
      <ellipse cx="8" cy="6.5" rx="2.4" ry="1.8" fill="#5a105c"/>
    </pattern>
    <clipPath id="banner"><path d="M22 18 H178 V176 L100 230 L22 176 Z"/></clipPath>
  </defs>
  <!-- the banner -->
  <path d="M22 18 H178 V176 L100 230 L22 176 Z" fill="#1b1820"/>
  <g clip-path="url(#banner)">
    <path d="M22 18 H178 V60 Q100 44 22 60 Z" fill="#24202b"/>
    <!-- the beaded trim -->
    <rect x="22" y="18" width="16" height="230" fill="url(#beads)"/>
    <rect x="162" y="18" width="16" height="230" fill="url(#beads)"/>
    <path d="M22 176 L100 230 L178 176 L178 192 L100 246 L22 192 Z" fill="url(#beads)"/>
  </g>
  <path d="M22 18 H178 V176 L100 230 L22 176 Z" fill="none" stroke="#0b0a0e" stroke-width="3" stroke-linejoin="round"/>
  <!-- the gold rod and its finials -->
  <rect x="10" y="10" width="180" height="11" rx="5.5" fill="#e3b54a" stroke="#6b4a10" stroke-width="2"/>
  <rect x="14" y="12" width="172" height="3" rx="1.5" fill="#fbe7a0"/>
  <circle cx="10" cy="15.5" r="8" fill="#e3b54a" stroke="#6b4a10" stroke-width="2"/>
  <circle cx="190" cy="15.5" r="8" fill="#e3b54a" stroke="#6b4a10" stroke-width="2"/>
  <!-- the Coil: the guild's own tabard emblem from the game (Blizzard emblem 37, img/crest/emblem-37.png, embedded so the
       picture works as an image anywhere): a slender serpent ringed round in mesh scales, its two heads rearing at the top
       with their jaws open. The grey art is tinted the tabard's bright magenta, with a dark edge and a soft inner shade. -->
  <defs>
    <filter id="coil-tint" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feColorMatrix in="SourceGraphic" type="matrix" values="1.25 0 0 0 0.12  0.36 0 0 0 0.03  1.25 0 0 0 0.16  0 0 0 1.35 0" result="tint"/>
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.9" result="fat"/>
      <feFlood flood-color="#26062b"/>
      <feComposite in2="fat" operator="in" result="edge"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="glowA"/>
      <feFlood flood-color="#d43bd6" flood-opacity=".45"/>
      <feComposite in2="glowA" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="edge"/><feMergeNode in="tint"/></feMerge>
    </filter>
  </defs>
  <image x="29.7" y="51.7" width="140.6" height="140.6" filter="url(#coil-tint)" href="data:image/png;base64,"/></svg>
