# Guild Roster sync: pulls the roster from the Blizzard WoW API into data/roster.json.
# Runs every hour (tools/sync_roster.mjs skips if data/roster-config.json asks for a slower pace),
# and on demand from roster-admin.html ("Sync now" / "Test connection") or the Actions tab.
# Needs repository secrets BLIZZARD_CLIENT_ID and BLIZZARD_CLIENT_SECRET.
name: Guild roster sync
run-name: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'test' && 'Roster connection test' || 'Roster sync (manual)') || 'Roster sync (hourly)' }}

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the top of the hour when GitHub's runners are busiest
  workflow_dispatch:
    inputs:
      mode:
        description: "sync = refresh the roster now, test = only check the Blizzard connection"
        type: choice
        options: [sync, test]
        default: sync

permissions:
  contents: write

concurrency:
  group: roster-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync roster from Blizzard
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "test" ]; then
            node tools/sync_roster.mjs --test
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node tools/sync_roster.mjs --force
          else
            node tools/sync_roster.mjs
          fi

      # Commit even when the sync failed, so sync-status.json shows the error on the site.
      - name: Commit roster data
        if: always() && inputs.mode != 'test'
        run: |
          git config user.name "xalreth-roster-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Guild roster sync $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
            sleep $((i * 5))
          done
          exit 1
