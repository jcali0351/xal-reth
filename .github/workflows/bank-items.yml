# Guild Bank item icons: after a new bank export lands in data/guild-bank.json (uploaded from the Sanctum Editor),
# fetch the icon of every item from the Blizzard WoW API into data/item-cache.json (tools/sync_bank_items.mjs).
# Uses the same BLIZZARD_CLIENT_ID / BLIZZARD_CLIENT_SECRET secrets as the guild roster.
name: Guild bank item icons
run-name: Guild bank item icons

on:
  push:
    branches: [main]
    paths: ["data/guild-bank.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bank-items
  cancel-in-progress: false

jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch item icons from Blizzard
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: node tools/sync_bank_items.mjs
      - name: Commit
        run: |
          git config user.name "xalreth-bank-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/item-cache.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Guild bank item icons $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main; sleep $((i * 5))
          done
          exit 1
